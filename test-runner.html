<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireX | Autonomous Test Runner</title>
  <link rel="icon" type="image/svg+xml" href="assets/hirex-mark.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .test-shell { max-width: 960px; margin: 48px auto; }
    .test-header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
    .test-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
    .test-summary .dashboard-card { text-align: center; }
    .test-list { display: grid; gap: 8px; }
    .test-row { display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 14px 16px; background: #fff; border: 1px solid var(--border); border-radius: 8px; }
    .test-row.pass { border-left: 4px solid var(--success); }
    .test-row.fail { border-left: 4px solid var(--danger); }
    .test-status { font-family: "Segoe UI", sans-serif; font-weight: 800; font-size: 0.78rem; letter-spacing: 0.06em; }
    .pass .test-status { color: var(--success); }
    .fail .test-status { color: var(--danger); }
    .test-detail { color: var(--muted); font-size: 0.9rem; }
    @media (max-width: 650px) { .test-header, .test-row { align-items: flex-start; flex-direction: column; } .test-summary { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="container test-shell">
    <div class="test-header">
      <div>
        <span class="eyebrow">Quality check</span>
        <h1>Autonomous test runner</h1>
        <p class="muted-text">Browser smoke tests for every role and core workflow.</p>
      </div>
      <button class="btn btn-primary" id="runTests">Run tests</button>
    </div>
    <div class="test-summary" id="testSummary">
      <div class="dashboard-card"><h3>Passed</h3><p class="value" id="passedCount">0</p></div>
      <div class="dashboard-card"><h3>Failed</h3><p class="value" id="failedCount">0</p></div>
      <div class="dashboard-card"><h3>Status</h3><p class="value" id="runStatus">Ready</p></div>
    </div>
    <section class="list-panel">
      <div class="panel-heading"><h2>Test results</h2><span id="runTime" class="test-detail"></span></div>
      <div id="testResults" class="test-list"><p class="empty-state">Press Run tests to begin.</p></div>
    </section>
    <iframe id="testFrame" title="Application test frame" hidden></iframe>
  </main>
  <script src="js/main.js"></script>
  <script src="js/autonomous-tests.js"></script>
</body>
</html>

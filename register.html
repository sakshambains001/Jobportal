<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireX | Register</title>
  <link rel="icon" type="image/svg+xml" href="assets/hirex-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="hirexGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="12" fill="url(#hirexGradient)"/><path d="M10 11v18m9-18v18m-9-9h9m5-8 11 16m0-16L24 28" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Hire<span class="logo-x">X</span></span></a>
      <button class="mobile-menu" id="mobileMenuButton" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="jobs.html">Jobs</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" id="loginNav">Login</a></li>
        <li><a href="register.html" id="registerNav">Register</a></li>
        <li><span class="user-badge" id="userBadge"></span></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="form-wrap">
      <h2 class="section-title">Create Account</h2>
      <div id="messageBox" class="message"></div>

      <form id="registerForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
          </div>

          <div class="form-group full">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrap">
              <input type="password" id="password" name="password" placeholder="Enter password" required>
              <button type="button" class="password-toggle" data-toggle="password">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-input-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
              <button type="button" class="password-toggle" data-toggle="confirmPassword">Show</button>
            </div>
          </div>

          <div class="form-group full">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="">Select a role</option>
              <option value="job_seeker">Job Seeker</option>
              <option value="employer">Employer</option>
            </select>
          </div>
        </div>

        <div class="button-row" style="margin-top: 22px;">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-row">
      <div>
        <h3>HireX</h3>
        <p>Register and start your career journey.</p>
      </div>
      <div>
        <p>© <span id="year"></span> HireX</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireX | Profile</title>
  <link rel="icon" type="image/svg+xml" href="assets/hirex-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="seeker-profile">
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="hirexGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="12" fill="url(#hirexGradient)"/><path d="M10 11v18m9-18v18m-9-9h9m5-8 11 16m0-16L24 28" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Hire<span class="logo-x">X</span></span></a>
      <button class="mobile-menu" id="mobileMenuButton" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="jobs.html">Jobs</a></li>
        <li><a href="seeker-dashboard.html">Dashboard</a></li>
        <li><a href="my-applications.html">Applications</a></li>
        <li><a href="saved-jobs.html">Saved Jobs</a></li>
        <li><a href="seeker-profile.html">Profile</a></li>
        <li><a href="#" id="logoutBtn">Logout</a></li>
      </ul>
    </div>
  </header>

  <main class="container section">
    <div class="page-shell">
      <aside class="sidebar">
        <nav>
          <a href="seeker-dashboard.html">Dashboard</a>
          <a href="jobs.html">Jobs</a>
          <a href="my-applications.html">Applications</a>
          <a href="saved-jobs.html">Saved Jobs</a>
          <a href="seeker-profile.html" class="active">Profile</a>
          <a href="#" id="logoutBtnSide">Logout</a>
        </nav>
      </aside>

      <div class="form-wrap">
        <h2 class="section-title">Edit Profile</h2>
        <div id="messageBox" class="message"></div>

        <form id="profileForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="profileName">Name</label>
              <input id="profileName" type="text" name="profileName">
            </div>
            <div class="form-group">
              <label for="profileEmail">Email</label>
              <input id="profileEmail" type="email" name="profileEmail">
            </div>
            <div class="form-group">
              <label for="profilePhone">Phone</label>
              <input id="profilePhone" type="tel" name="profilePhone">
            </div>
            <div class="form-group">
              <label for="profileLocation">Location</label>
              <input id="profileLocation" type="text" name="profileLocation">
            </div>
            <div class="form-group full">
              <label for="profileEducation">Education</label>
              <input id="profileEducation" type="text" name="profileEducation">
            </div>
            <div class="form-group full">
              <label for="profileSkills">Skills</label>
              <input id="profileSkills" type="text" name="profileSkills">
            </div>
            <div class="form-group full">
              <label for="profileExperience">Experience</label>
              <input id="profileExperience" type="text" name="profileExperience">
            </div>
            <div class="form-group full">
              <label for="profileDescription">Profile Description</label>
              <textarea id="profileDescription" name="profileDescription"></textarea>
            </div>
          </div>

          <div class="button-row" style="margin-top: 22px;">
            <button type="submit" class="btn btn-primary">Save Profile</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-row">
      <div>
        <h3>HireX</h3>
        <p>Manage your profile and visibility.</p>
      </div>
      <div>
        <p>© <span id="year"></span> HireX</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/seeker.js"></script>
</body>
</html>

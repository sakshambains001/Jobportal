<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireX | Contact</title>
  <link rel="icon" type="image/svg+xml" href="assets/hirex-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="hirexGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="12" fill="url(#hirexGradient)"/><path d="M10 11v18m9-18v18m-9-9h9m5-8 11 16m0-16L24 28" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Hire<span class="logo-x">X</span></span></a>
      <button class="mobile-menu" id="mobileMenuButton" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="jobs.html">Jobs</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html" id="loginNav">Login</a></li>
        <li><a href="register.html" id="registerNav">Register</a></li>
        <li><span class="user-badge" id="userBadge"></span></li>
      </ul>
    </div>
  </header>

  <main class="container section">
    <div class="form-wrap">
      <h2 class="section-title">Contact Us</h2>
      <form>
        <div class="form-grid">
          <div class="form-group full">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your Full Name">
          </div>
          <div class="form-group full">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Your Email">
          </div>
          <div class="form-group full">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message here..."></textarea>
          </div>
        </div>

        <div class="button-row" style="margin-top: 20px;">
          <button type="submit" class="btn btn-primary">Send Message</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-row">
      <div>
        <h3>HireX</h3>
        <p>We are here to support your career goals.</p>
      </div>
      <div>
        <p>© <span id="year"></span> HireX</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
